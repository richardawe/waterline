name: Generate blog posts

# Auto-publish pipeline: triggers generation on the live backend over HTTPS
# (the backend already has localhost Postgres access, so this workflow never
# connects to the database directly), rebuilds the static /blog site from
# the same API, and pushes straight to main — which is what triggers
# deploy.yml's existing FTP job, so publishing a post is just "another push
# of static files" with no changes needed there. See docs/blog-pipeline.md
# for the full design and the human-review safety net (admin.html's Blog
# tab) that this relies on since there is no pre-publish approval gate.

on:
  schedule:
    - cron: "0 8 * * *" # daily, 08:00 UTC
  workflow_dispatch:
    inputs:
      posts_per_run:
        description: "How many posts to attempt to generate this run"
        required: false
        default: "1"

concurrency:
  group: blog-generation
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write # to dispatch deploy.yml explicitly — see note below

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      BLOG_API_BASE: ${{ vars.BLOG_API_BASE || 'https://api.waterline.ng' }}
      ADMIN_API_USERNAME: ${{ secrets.ADMIN_API_USERNAME }}
      ADMIN_API_PASSWORD: ${{ secrets.ADMIN_API_PASSWORD }}
      BLOG_SITE_BASE_URL: ${{ vars.BLOG_SITE_BASE_URL || 'https://waterline.ng' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # notify.py reads this directly; the `permissions:` block alone doesn't inject it into run steps
    steps:
      - uses: actions/checkout@v6

      - name: Require blog secrets
        run: |
          if [ -z "$ADMIN_API_USERNAME" ] || [ -z "$ADMIN_API_PASSWORD" ]; then
            echo "::error::ADMIN_API_USERNAME and ADMIN_API_PASSWORD secrets are required (see docs/blog-pipeline.md) — same credentials admin.html already uses."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: python -m pip install -r requirements.txt

      - name: Seed content-calendar topics (idempotent — only inserts new prompts)
        run: |
          curl -sf -u "$ADMIN_API_USERNAME:$ADMIN_API_PASSWORD" -X POST "$BLOG_API_BASE/admin/blog/seed-topics"

      - name: Trigger generation on the backend (writer -> QA -> publish/qa_failed)
        run: python scripts/trigger_blog_generation.py --posts-per-run "${{ github.event.inputs.posts_per_run || '1' }}"

      - name: Rebuild static /blog site from the live API
        run: python scripts/build_blog_static.py --source api

      - name: Commit and push generated static files
        id: publish
        working-directory: .
        run: |
          git config user.name "waterline-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No static content changes to publish."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-publish blog content"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 2))
            git fetch origin main
            git rebase origin/main
          done

      - name: Trigger the frontend deploy
        if: steps.publish.outputs.pushed == 'true'
        run: |
          # A push made with this workflow's own GITHUB_TOKEN does NOT fire
          # other workflows' `on: push` triggers — GitHub's built-in
          # anti-recursion guard (see
          # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#triggering-a-workflow-from-a-workflow).
          # That means the commit above would silently never reach
          # production without this: explicitly dispatch deploy.yml, which
          # is exempt from that guard since it's a workflow_dispatch call
          # via the API rather than a push event. Only runs when something
          # was actually pushed, so a no-op day doesn't force an unnecessary
          # backend restart.
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
