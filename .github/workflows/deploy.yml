name: Deploy to cPanel

# Pushes to main deploy straight to production. See DEPLOYMENT.md for the
# one-time cPanel setup (Python App, Postgres, secrets) this workflow assumes
# already exists — this workflow updates code, it doesn't provision infra.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject production API URL
        run: |
          API_BASE="${{ vars.PROD_API_BASE }}"
          if [ -z "$API_BASE" ]; then
            echo "::error::vars.PROD_API_BASE is not set — see DEPLOYMENT.md. Refusing to deploy a frontend with no API URL."
            exit 1
          fi
          printf '// Generated by .github/workflows/deploy.yml at %s — do not edit by hand.\nwindow.WATERLINE_API_BASE = %s;\n' \
            "$(date -u +%FT%TZ)" "$(printf '%s' "$API_BASE" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
            > assets/config.js
          cat assets/config.js

      - name: Render admin.html basic-auth protection
        run: |
          HTPASSWD_PATH="${{ vars.CPANEL_HTPASSWD_ABS_PATH }}"
          ADMIN_USER="${{ secrets.ADMIN_BASIC_AUTH_USER }}"
          ADMIN_PASS="${{ secrets.ADMIN_BASIC_AUTH_PASSWORD }}"
          if [ -z "$HTPASSWD_PATH" ] || [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASS" ]; then
            echo "::error::vars.CPANEL_HTPASSWD_ABS_PATH, secrets.ADMIN_BASIC_AUTH_USER, and secrets.ADMIN_BASIC_AUTH_PASSWORD are all required — see DEPLOYMENT.md. Refusing to deploy admin.html unprotected."
            exit 1
          fi
          sed "s#__HTPASSWD_ABS_PATH__#${HTPASSWD_PATH}#" deploy/.htaccess.template > .htaccess
          printf '%s:%s\n' "$ADMIN_USER" "$(openssl passwd -apr1 "$ADMIN_PASS")" > .htpasswd
          echo "Rendered .htaccess:"; cat .htaccess

      - name: Deploy static site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FRONTEND_REMOTE_DIR }}
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/backend/**
            **/deploy/**
            **/docs/**
            **/data/**
            **/node_modules/**
            **/DEPLOYMENT.md

      - name: Clean up generated secrets from the runner
        if: always()
        run: rm -f .htpasswd .htaccess assets/config.js

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Passenger reloads the app whenever tmp/restart.txt's mtime changes.
      # Stamping it here means every deploy restarts the app, whether or not
      # the SSH automation below is configured.
      - name: Stamp restart trigger
        run: mkdir -p backend/tmp && date -u > backend/tmp/restart.txt

      - name: Refuse to deploy backend without an explicit target directory
        if: ${{ vars.BACKEND_REMOTE_DIR == '' }}
        run: |
          echo "::error::vars.BACKEND_REMOTE_DIR is not set. Skipping the backend FTP upload rather than defaulting to the FTP account's root — that account may be the same one the frontend deploys to, and an unset server-dir would dump backend source (including passenger_wsgi.py, requirements.txt, app/) into the public static site directory. Set BACKEND_REMOTE_DIR once the cPanel Python App's Application Path is known — see DEPLOYMENT.md."
          exit 1

      - name: Deploy backend source via FTP
        if: ${{ vars.BACKEND_REMOTE_DIR != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.BACKEND_REMOTE_DIR }}
          local-dir: ./backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.venv/**
            **/__pycache__/**
            **/*.pyc
            **/.pytest_cache/**
            **/.env
            **/tests/**

      - name: Install dependencies and run migrations (requires SSH secrets)
        if: ${{ vars.CPANEL_SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ vars.CPANEL_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ vars.BACKEND_REMOTE_DIR }}"
            source "${{ vars.CPANEL_PYTHON_VENV_ACTIVATE }}"
            pip install -r requirements.txt
            alembic upgrade head
            touch tmp/restart.txt
            echo "Dependencies installed, migrations applied, app restarted."

      - name: Reminder when SSH automation isn't configured
        if: ${{ vars.CPANEL_SSH_HOST == '' }}
        run: |
          echo "::warning::No CPANEL_SSH_HOST configured — 'pip install' and 'alembic upgrade head' were NOT run automatically."
          echo "::warning::If requirements.txt or the DB schema changed in this push, log into cPanel now: Setup Python App → your app → Run Pip Install; then run 'alembic upgrade head' from the app's terminal. The app already restarted on old dependencies/schema in the meantime — see DEPLOYMENT.md."
