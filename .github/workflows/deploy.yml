name: Deploy to cPanel

# Pushes to main deploy straight to production. See DEPLOYMENT.md for the
# one-time cPanel setup (Python App, Postgres, secrets) this workflow assumes
# already exists — this workflow updates code, it doesn't provision infra.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: waterline
          POSTGRES_PASSWORD: waterline
          POSTGRES_DB: waterline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U waterline -d waterline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://waterline:waterline@localhost:5432/waterline_test
      TEST_DATABASE_URL: postgresql+psycopg://waterline:waterline@localhost:5432/waterline_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q

  deploy-frontend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate frontend deployment target
        env:
          REMOTE_DIR: ${{ vars.FRONTEND_REMOTE_DIR }}
        run: |
          if [ -z "$REMOTE_DIR" ]; then
            echo "::error::vars.FRONTEND_REMOTE_DIR is required."
            exit 1
          fi
          case "$REMOTE_DIR" in
            /|/*/) ;;
            *)
              echo "::error::FRONTEND_REMOTE_DIR must start and end with / (for example /)."
              exit 1
              ;;
          esac

      - name: Inject production API URL
        run: |
          API_BASE="${{ vars.PROD_API_BASE }}"
          if [ -z "$API_BASE" ]; then
            echo "::error::vars.PROD_API_BASE is not set — see DEPLOYMENT.md. Refusing to deploy a frontend with no API URL."
            exit 1
          fi
          printf '// Generated by .github/workflows/deploy.yml at %s — do not edit by hand.\nwindow.WATERLINE_API_BASE = %s;\n' \
            "$(date -u +%FT%TZ)" "$(printf '%s' "$API_BASE" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
            > assets/config.js
          cat assets/config.js

      - name: Render admin.html basic-auth protection
        run: |
          HTPASSWD_PATH="${{ vars.CPANEL_HTPASSWD_ABS_PATH }}"
          ADMIN_USER="${{ secrets.ADMIN_BASIC_AUTH_USER }}"
          ADMIN_PASS="${{ secrets.ADMIN_BASIC_AUTH_PASSWORD }}"
          if [ -z "$HTPASSWD_PATH" ] || [ -z "$ADMIN_USER" ] || [ -z "$ADMIN_PASS" ]; then
            echo "::error::vars.CPANEL_HTPASSWD_ABS_PATH, secrets.ADMIN_BASIC_AUTH_USER, and secrets.ADMIN_BASIC_AUTH_PASSWORD are all required — see DEPLOYMENT.md. Refusing to deploy admin.html unprotected."
            exit 1
          fi
          sed "s#__HTPASSWD_ABS_PATH__#${HTPASSWD_PATH}#" deploy/.htaccess.template > .htaccess
          printf '%s:%s\n' "$ADMIN_USER" "$(openssl passwd -apr1 "$ADMIN_PASS")" > .htpasswd
          echo "Rendered .htaccess:"; cat .htaccess

      - name: Deploy static site via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FRONTEND_FTP_USERNAME }}
          password: ${{ secrets.FRONTEND_FTP_PASSWORD }}
          server-dir: ${{ vars.FRONTEND_REMOTE_DIR }}
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/backend/**
            **/deploy/**
            **/docs/**
            **/data/**
            **/node_modules/**
            **/DEPLOYMENT.md

      - name: Clean up generated secrets from the runner
        if: always()
        run: rm -f .htpasswd .htaccess assets/config.js

  deploy-backend:
    needs: test-backend
    if: ${{ vars.ENABLE_BACKEND_DEPLOY == 'bootstrap' || vars.ENABLE_BACKEND_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Require complete server automation settings
        if: ${{ vars.ENABLE_BACKEND_DEPLOY == 'true' }}
        env:
          SSH_HOST: ${{ vars.CPANEL_SSH_HOST }}
          APP_ROOT: ${{ vars.CPANEL_APP_ROOT }}
          VENV_ACTIVATE: ${{ vars.CPANEL_PYTHON_VENV_ACTIVATE }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$APP_ROOT" ] || [ -z "$VENV_ACTIVATE" ]; then
            echo "::error::Backend deployment requires CPANEL_SSH_HOST, CPANEL_APP_ROOT, and CPANEL_PYTHON_VENV_ACTIVATE."
            exit 1
          fi

      - name: Validate backend deployment target
        env:
          REMOTE_DIR: ${{ vars.BACKEND_REMOTE_DIR }}
        run: |
          if [ -z "$REMOTE_DIR" ]; then
            echo "::error::vars.BACKEND_REMOTE_DIR is required."
            exit 1
          fi
          case "$REMOTE_DIR" in
            /|/*/) ;;
            *)
              echo "::error::BACKEND_REMOTE_DIR must start and end with / (for example /)."
              exit 1
              ;;
          esac

      - name: Bundle Tier 1 seed data
        run: |
          mkdir -p backend/seed_data
          cp -R data/market-intelligence backend/seed_data/

      - name: Deploy backend source via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.BACKEND_FTP_USERNAME }}
          password: ${{ secrets.BACKEND_FTP_PASSWORD }}
          server-dir: ${{ vars.BACKEND_REMOTE_DIR }}
          local-dir: ./backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.venv/**
            **/__pycache__/**
            **/*.pyc
            **/.pytest_cache/**
            **/.env
            **/tests/**

      - name: Install dependencies, migrate, and restart on cPanel
        if: ${{ vars.ENABLE_BACKEND_DEPLOY == 'true' }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.CPANEL_SSH_HOST }}
          username: ${{ secrets.CPANEL_SSH_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ vars.CPANEL_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ vars.CPANEL_APP_ROOT }}"
            source "${{ vars.CPANEL_PYTHON_VENV_ACTIVATE }}"
            pip install -r requirements.txt
            alembic upgrade head
            touch tmp/restart.txt
            echo "Dependencies installed, migrations applied, app restarted."
