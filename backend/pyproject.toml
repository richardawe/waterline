[project]
name = "waterline-backend"
version = "0.1.0"
description = "Waterline loan-book platform: Postgres market-intel + WCDS loan-tape ingestion + SPV structuring pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "pgvector>=0.2.5",
    "python-dateutil>=2.9",
    "a2wsgi>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
