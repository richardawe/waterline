<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">

<script src="/collections/assets/auth.js?v=__ASSET_VERSION__" defer></script>

<body data-page="login" class="marketing">
<header class="bar"><div class="wrap bar-in">
  <a class="logo" href="/collections/"><span class="logo-mark" aria-hidden="true">W</span>Waterline <small>Collections</small></a>
  <nav class="menu" style="display:flex;position:static;padding:0;border:0;flex-direction:row" aria-label="Main"><a href="/collections/signup/">Get started</a></nav>
</div></header>
<main><div class="narrow">
<h1>Log in</h1>
<form id="login" data-clarity-mask="true" class="card" novalidate>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
  <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
  <div id="form-msg"></div>
  <button class="btn block" type="submit">Log in</button>
  <p class="small" style="margin:12px 0 0"><a href="/collections/reset/">Forgot your password?</a></p>
</form>
<p class="small center">New here? <a href="/collections/signup/">Get started free</a></p>
</div></main>
<footer class="site"><div class="wrap">
  <p><a href="/collections/privacy/">Privacy policy</a> · <a href="/collections/terms/">Terms</a> · <a href="mailto:collections@waterline.ng">collections@waterline.ng</a></p>
  <p class="tiny">© Waterline · <a href="https://waterline.ng/">waterline.ng</a></p>
</div></footer>
</body>
</html>
