<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Waterline Collections</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f6b4f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230f6b4f%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Arial%27 font-size=%2716%27 font-weight=%27700%27 fill=%27white%27 text-anchor=%27middle%27%3EW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/collections/assets/cl.css?v=__ASSET_VERSION__">
<script src="/assets/config.js?v=__ASSET_VERSION__"></script>
<script src="/collections/assets/cl.js?v=__ASSET_VERSION__" defer></script>
<script src="/collections/assets/auth.js?v=__ASSET_VERSION__" defer></script>
</head>
<body data-page="reset">
<header class="bar"><div class="wrap bar-in">
  <a class="logo" href="/collections/"><span class="logo-mark" aria-hidden="true">W</span>Waterline <small>Collections</small></a>
  <nav class="menu" style="display:flex;position:static;padding:0;border:0;flex-direction:row" aria-label="Main"><a href="/collections/login/">Log in</a></nav>
</div></header>
<main><div class="narrow">
<div id="request" class="hidden">
<h1>Reset your password</h1>
<form id="forgot" class="card" novalidate>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
  <div id="form-msg"></div>
  <button class="btn block" type="submit">Send reset link</button>
</form></div>
<div id="choose" class="hidden">
<h1 id="choose-title">Choose a new password</h1>
<form id="newpass" class="card" novalidate>
  <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" minlength="10" required autocomplete="new-password"><div class="hint">At least 10 characters, mixing letters with numbers or symbols.</div></div>
  <div id="form-msg2"></div>
  <button class="btn block" type="submit">Save password</button>
</form></div>
</div></main>
<footer class="site"><div class="wrap">
  <p><a href="/collections/privacy/">Privacy policy</a> · <a href="/collections/terms/">Terms</a> · <a href="mailto:collections@waterline.ng">collections@waterline.ng</a></p>
  <p class="tiny">© Waterline · <a href="https://waterline.ng/">waterline.ng</a></p>
</div></footer>
</body>
</html>
